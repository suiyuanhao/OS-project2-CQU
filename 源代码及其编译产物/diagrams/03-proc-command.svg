<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">实验三：/proc 指令分发架构</title>
  <desc id="desc">展示 inc、dec、reset 和数字指令进入 C shim 后由 Rust 进行解析、原子更新或错误处理。</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0B1220"/><stop offset="1" stop-color="#17233D"/></linearGradient>
    <linearGradient id="rust" x1="0" x2="1"><stop stop-color="#E26D5A"/><stop offset="1" stop-color="#F5A65B"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#CBD5E1"/></marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="85" y="95" fill="#F8FAFC" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700">实验三 · /proc 指令分发</text>
  <text x="85" y="140" fill="#94A3B8" font-family="Microsoft YaHei, sans-serif" font-size="22">从字符串命令到原子状态更新：复杂分支中的安全控制流</text>
  <rect x="85" y="260" width="245" height="350" rx="24" fill="#16243A" stroke="#64748B" stroke-width="2" filter="url(#shadow)"/>
  <text x="207" y="320" text-anchor="middle" fill="#F8FAFC" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">用户输入</text>
  <g font-family="Consolas, Microsoft YaHei, sans-serif" font-size="25" fill="#A7F3D0"><rect x="125" y="360" width="165" height="48" rx="12" fill="#1D3557"/><text x="207" y="393" text-anchor="middle">inc</text><rect x="125" y="425" width="165" height="48" rx="12" fill="#1D3557"/><text x="207" y="458" text-anchor="middle">dec</text><rect x="125" y="490" width="165" height="48" rx="12" fill="#1D3557"/><text x="207" y="523" text-anchor="middle">reset / 999</text></g>
  <path d="M330 435 H420" stroke="#CBD5E1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="440" y="315" width="275" height="245" rx="24" fill="#1D3557" stroke="#3984C6" stroke-width="2" filter="url(#shadow)"/>
  <text x="577" y="375" text-anchor="middle" fill="#62B6E8" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="700">C shim</text>
  <text x="577" y="425" text-anchor="middle" fill="#F8FAFC" font-family="Microsoft YaHei, sans-serif" font-size="22">copy_from_user</text>
  <text x="577" y="468" text-anchor="middle" fill="#F8FAFC" font-family="Microsoft YaHei, sans-serif" font-size="22">proc_ops / FFI</text>
  <text x="577" y="511" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, sans-serif" font-size="19">只做 Linux 适配</text>
  <path d="M715 435 H795" stroke="#CBD5E1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="815" y="190" width="690" height="520" rx="26" fill="#111C31" stroke="#E26D5A" stroke-width="2" filter="url(#shadow)"/>
  <text x="860" y="250" fill="#F5A65B" font-family="Microsoft YaHei, sans-serif" font-size="28" font-weight="700">Rust 核心：match / if let + Atomic</text>
  <path d="M1160 290 V335" stroke="#CBD5E1" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="895" y="345" width="230" height="88" rx="16" fill="#3A2430"/><text x="1010" y="398" text-anchor="middle" fill="#F8FAFC" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23">inc / dec</text>
  <rect x="1170" y="345" width="230" height="88" rx="16" fill="#3A2430"/><text x="1285" y="398" text-anchor="middle" fill="#F8FAFC" font-family="Consolas, Microsoft YaHei, sans-serif" font-size="23">reset / number</text>
  <rect x="1030" y="505" width="260" height="90" rx="16" fill="#173B3A"/><text x="1160" y="558" text-anchor="middle" fill="#A7F3D0" font-family="Microsoft YaHei, sans-serif" font-size="23">Atomic 更新</text>
  <rect x="1330" y="505" width="130" height="90" rx="16" fill="#4A2530"/><text x="1395" y="558" text-anchor="middle" fill="#FCA5A5" font-family="Microsoft YaHei, sans-serif" font-size="21">非法输入</text>
  <path d="M1010 433 V495 H1080" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1285 433 V495 H1240" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1400 433 V495" stroke="#CBD5E1" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="1160" y="650" text-anchor="middle" fill="#CBD5E1" font-family="Microsoft YaHei, sans-serif" font-size="21">统一返回：COMMAND_COUNT / INVALID_COUNT / -EINVAL</text>
  <text x="85" y="825" fill="#94A3B8" font-family="Microsoft YaHei, sans-serif" font-size="21">重点：Rust 不消灭分支，而是让解析结果和失败出口成为显式、可检查的结构</text>
</svg>
